<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" async defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Nastaliq+Urdu:wght@400..700&family=Pixelify+Sans:wght@400..700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="head">
            <h1 class="heading">ROCK PAPER AND SCISSOR</h1>
        </header>
       <main>
        <div class="background">
            
            <div class="buttons">
                <button class="rock">
                    <img src="rock.png" alt="Rock icon">
                    ROCK</button>
                <button class="paper">
                    <img src="paper.png" alt="paper icon">
                    PAPER</button>
                <button class="scissor">
                    <img src="scissor.png" alt="scissor icon">
                    SCISSOR</button>
            </div>

            <div class="score_board">
                <h3 class="text_score">Current score</h3>
                <h3 class="human_score">Human:0</h3>
                <h3 class="computer_score">Computer:0</h3>
            </div>
        </div>
        

       </main>
        
    </body>
</html>
